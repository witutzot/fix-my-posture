name: fix_my_posture
description: A posture correction app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0
  supabase_flutter: ^2.3.4
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_local_notifications: ^16.0.0
  shared_preferences: ^2.2.0
  intl: ^0.18.0
  flutter_animate: ^4.2.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.7
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/ 